<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
      integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script type="module" src="./assets/js/index.js"></script>

    <!-- <link href="https://afripoli.org/assets/themes/magazine/css/style-2.3.min.css" rel="stylesheet"> -->
    <link
      rel="stylesheet"
      type="text/css"
      href="./assets/css/printContainer.css"
    />
    <link rel="stylesheet" type="text/css" href="./assets/css/main.css" />
    <link rel="stylesheet" type="text/css" href="./assets/css/vis-layout.css" />

    <title>PIE - Climate financing</title>
  </head>

  <body>
    <!-- <p class="vis-tagline">
      Mapping bilateral climate finance agreements between African countries,
      China, the EU, and Gulf states.
    </p> -->

    <!---**************** [MOBILE] START SCROLLBAR ****************--->
    <div class="mobilePickerDiv">
      <div class="mobilePickerDivContent" id="picker">
        <div class="mobilePickerPanel">
          <div class="mobilePickerChoose d-none d-xl-lg-block">
            <span class="cancel" onclick="cancel()">Close</span>
            <span class="confirm" onclick="confirmPicker()">Select</span>
            <h1 class="pickerTitle"></h1>
          </div>
          <div class="mobilePickerText">
            <div class="wheelWrapperDiv">
              <div class="wheelScrollbar"></div>
              <div class="wheel" id="wheelWrapper">
                <ul class="wheel-scroll" id="wheelList"></ul>
              </div>
            </div>
          </div>
          <div class="mobilePickerFooter"></div>
        </div>
      </div>
    </div>
    <!---**************** [MOBILE] END SCROLLBAR ****************--->

    <!-- MAIN VISUALIZATION — replaces .mainVisDiv -->
    <div class="vis-container">
      <!-- Dark header bar with integrated title -->
      <div class="vis-header">
        <div>
          <h1 class="vis-header__title">Africa's Green Transition</h1>
          <p class="vis-header__subtitle fw-lighter">
            Mapping bilateral climate finance agreements between African countries,
      China, the EU, and Gulf states.
          </p>
        </div>
      </div>
      <!-- Controls move here from inside the map, so they sit in the header -->
        <div style="display: flex; align-items: center; gap: 12px">
          <button
            id="africaButton"
            style="
              background: transparent;
              border: 0.5px solid #3d5c41;
              color: #a8c9ab;
              border-radius: 6px;
              padding: 5px 12px;
              font-size: 9pt;
              cursor: pointer;
              font-family: &quot;UncutRegular&quot;, sans-serif;
              position: absolute;
              right: calc(25% + (var(--bs-gutter-x) / 2));
              top: calc(13% + (var(--bs-gutter-y)));
              z-index: 5;
            "
          >
            Overview
          </button>
        </div>
      <!-- Three-column body -->
      <div class="vis-body row">
        <!-- LEFT: Partner sidebar -->
        <!-- Keep .diplomacy-map-nav and .countrySelect/.map-menu-item classes
         so layout.js can still find them with document.querySelectorAll(".countrySelect") -->
        
         <!-- For mobile only: pill -->
        <!-- For mobile only -->
        <div class="mobile-partner-bar" id="mobilePartnerBar">
          <button class="mobile-partner-pill countrySelect" data-slug="China">
            <img src="assets/img/icons/China_2.svg" alt="China" />
            <span class="label">China</span>
          </button>
          <button
            class="mobile-partner-pill countrySelect"
            data-slug="EuropeanUnion"
          >
            <img src="assets/img/icons/EU.svg" alt="European Union" />
            <span class="label">European Union</span>
          </button>
          <button
            class="mobile-partner-pill countrySelect"
            data-slug="GulfCooperationCouncil"
          >
            <img src="assets/img/icons/GCC.svg" alt="Gulf Countries" />
            <span class="label">Gulf Countries</span>
          </button>
        </div>
          <!-- For other ports -->
         <aside
          class="vis-sidebar diplomacy-map-nav col-xl-1 col-sm-2 col-12"
          aria-label="Partner selection"
        >
          <p class="vis-sidebar__label d-flex justify-content-center vis-panel__zone-text">Partners</p>
          <ul class="map-menu js-mapMenu">
            <li class="countrySelect map-menu-item" data-slug="China">
              <div class="image d-flex justify-content-center">
                <img
                  src="assets/img/icons/China_2.svg"
                  alt="China"
                  class="default"
                />
                <img
                  src="assets/img/icons/China_active_2.svg"
                  alt="China selected"
                  class="active"
                />
              </div>
              <div class="label text-center">China</div>
            </li>
            <li class="countrySelect map-menu-item" data-slug="EuropeanUnion">
              <div class="image d-flex justify-content-center">
                <img
                  src="assets/img/icons/EU.svg"
                  alt="European Union"
                  class="default"
                />
                <img
                  src="assets/img/icons/EU_active.svg"
                  alt="European Union selected"
                  class="active"
                />
              </div>
              <div class="label text-center">European Union</div>
            </li>
            <li
              class="countrySelect map-menu-item"
              data-slug="GulfCooperationCouncil"
            >
              <div class="image d-flex justify-content-center">
                <img
                  src="assets/img/icons/GCC.svg"
                  alt="Gulf Countries"
                  class="default"
                />
                <img
                  src="assets/img/icons/GCC_active.svg"
                  alt="Gulf Countries selected"
                  class="active"
                />
              </div>
              <div class="label text-center">Gulf Countries</div>
            </li>
          </ul>
        </aside>
        <!-- OVERVIEW BUTTON -->
         <!-- <button id="africaButton2">
            Overview
         </button> -->
        <!-- CENTER: Map -->
        <!-- Keep id="map" so D3 can find it with d3.select("#map") -->
        <main
          id="map"
          class="vis-map col-12"
          aria-label="Africa climate finance map"
        >
          <!-- Map legend — shown once a partner is selected -->
          <div class="vis-map__legend" id="mapLegend" style="display: none">
            <div class="vis-map__legend-item">
              <div
                class="vis-map__legend-dot"
                style="background: #d6cb62"
              ></div>
              <span class="vis-map__legend-label">Low connectivity</span>
            </div>
            <div class="vis-map__legend-item">
              <div
                class="vis-map__legend-dot"
                style="background: #6fb56f"
              ></div>
              <span class="vis-map__legend-label">Moderate</span>
            </div>
            <div class="vis-map__legend-item">
              <div
                class="vis-map__legend-dot"
                style="background: #1C4A20"
              ></div>
              <span class="vis-map__legend-label">High</span>
            </div>
          </div>

          <!-- Mobile touch overlay — keep as-is -->
          <!-- <div
            class="overlay col-12 pb-0 col-map-mobile d-sm-none d-block"
            id="showScrollable"
          >
            <div class="overlay-text">
              <img
                class="hand"
                src="./assets/img/icons/hand-touch.svg"
                alt=""
              />
              <h1 class="titleBlur">Touch the screen</h1>
              <h2 class="subtitleBlur">to start exploring the map</h2>
            </div>
          </div> -->
        </main>

        <!-- RIGHT: Info panel -->
        <!-- Keep .card.partnership so populateCountryCard and populatePartnerOverview
         can find it with document.querySelector(".card") and ".partner-overview-zone" -->
        <aside
          class="vis-panel col-12 col-sm-3"
          aria-label="Partner information"
        >
          <div class="third-col">
            <div class="card partnership expanded"></div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Hidden state spans — keep exactly as-is, used by JS -->
    <div class="hiddenDiv">
      <span class="_picker-open" id="selectedText">African</span>
      <span class="_picker-open" id="africanCountry">open</span>
      <span class="_picker-open" id="blockNameNowTemp">open</span>
      <span class="_picker-open" id="blockNameTemp">open</span>
    </div>
  </body>
</html>
